<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Drone Demo</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Additional inline styles if needed */
    </style>
  </head>
  <body>
    <div id="unity-container"></div>

    <div id="unityContainer" class="webgl-content">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    </div>

    <div id="loading-cover" style="display: none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="TemplateData/logo.png" alt="Logo"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
             <p style="color: white; font-family: sans-serif; font-size: 1em; margin-top: 10px;">Loading...</p>
        </div>
    </div>

    <div id="unity-fullscreen-button" style="display: none;"></div>


    <script>
      // --- Build Configuration ---
      // !!! IMPORTANT !!! This buildName is specifically for the drone demo.
      // If you copy this file for another demo, change this value!
      const buildName = "demo-drone-nav"; // <-- Build name for the drone demo

      const buildUrl = "Build"; // Path to the Build folder relative to index.html
      const loaderUrl = buildUrl + "/" + buildName + ".loader.js";

      const config = {
        dataUrl: buildUrl + "/" + buildName + ".data",
        frameworkUrl: buildUrl + "/" + buildName + ".framework.js",
        codeUrl: buildUrl + "/" + buildName + ".wasm",
        // If your build uses memory (.wasm.memory) or symbols (.symbols.json) files, add them manually
        // memoryUrl: buildUrl + "/" + buildName + ".wasm.memory",
        // symbolsUrl: buildUrl + "/" + buildName + ".symbols.json",

        streamingAssetsUrl: "StreamingAssets", // Path to StreamingAssets relative to index.html (if used)

        // Static product/company names, as Unity template variables are not available without rebuild
        companyName: "My Company",
        productName: "Drone Demo",
        productVersion: "1.0",
        // backgroundUrl: buildUrl + "/background.png", // Example if using a background image
        // matchWebGLToCanvasSize: false, // If you need to control canvas size manually
        // devicePixelRatio: 1, // For controlling resolution on mobile
        // showBanner: unityShowBanner, // If showBanner function from old template is needed, copy it here
      };

      // --- DOM Element References ---
      // Use IDs and classes from your style.css and HTML structure
      const container = document.querySelector("#unityContainer"); // Main content container (#unityContainer from reference)
      const canvas = document.querySelector("#unity-canvas"); // Rendering canvas
      const loadingCover = document.querySelector("#loading-cover"); // Loading overlay
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty"); // Empty progress bar div
      const progressBarFull = document.querySelector("#unity-progress-bar-full"); // Full progress bar div
      const fullscreenButton = document.querySelector("#unity-fullscreen-button"); // Fullscreen button
      const spinner = document.querySelector('.spinner'); // Spinner element
      // Add other element references if needed (e.g., for loading text)


      // --- Helper Functions and Initial Setup ---

      // Check for fullscreen API support (from reference)
      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen', 'webkitExitFullscreen', 'webkitCancelFullScreen',
            'mozCancelFullScreen', 'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      // Mobile detection and class assignment (from old template)
       const unityContainerBase = document.querySelector("#unity-container"); // Element for unity-desktop/mobile classes
       const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
       if (isMobile) {
          if(unityContainerBase) unityContainerBase.className = "unity-mobile";
          document.body.classList.add("unity-mobile");
          config.devicePixelRatio = 1; // Reduce resolution on mobile (optional)
       } else {
           if(unityContainerBase) unityContainerBase.className = "unity-desktop";
           document.body.classList.add("unity-desktop");
       }

       // Set canvas background if needed (if not set in style.css)
       // const backgroundFilename = "background.png"; // Replace with your background image file name if any
       // canvas.style.background = "url('" + buildUrl + "/" + backgroundFilename + "') center / cover"; // Example with background image


      // --- Unity Loading Logic ---

      // Show loading screen, as it's display: none in HTML
      // Reference sets it via: loadingCover.style.display = "";
      // Use 'flex' for Flexbox centering
      if(loadingCover) loadingCover.style.display = "flex";


      const script = document.createElement("script");
      script.src = loaderUrl; // Path to Unity loader script
      document.body.appendChild(script); // Add the script to the document body

      // Handle script loading errors
      script.onerror = () => {
           console.error("Failed to load Unity loader script:", loaderUrl);
           // Hide loading screen and show an alert
           if (loadingCover) loadingCover.style.display = 'none';
           alert("Failed to load the game. Please check the build path and file names.");
      };

      script.onload = () => {
        // Unity loader script is loaded and available (createUnityInstance)

        // Create the Unity instance
        createUnityInstance(canvas, config, (progress) => {
           // This function is called by Unity with loading progress (progress is 0 to 1)

           // Update the progress bar (logic from reference)
           if (progressBarFull) {
             progressBarFull.style.width = `${100 * progress}%`;
           }

           // Switch from spinner to progress bar when progress > 0
           // Logic from reference: spinner.style.display = "none"; progressBarEmpty.style.display = "";
           if (progress > 0.1) { // Switch after some initial progress
             if (spinner) spinner.style.display = "none";
             if (progressBarEmpty) progressBarEmpty.style.display = ""; // Show empty bar
           } else {
              // Show spinner while progress is near zero
               if (spinner) spinner.style.display = "block";
               if (progressBarEmpty) progressBarEmpty.style.display = "none";
           }

        }).then((unityInstance) => {
            // Game successfully loaded and initialized

            // Hide the loading screen (logic from reference)
            if (loadingCover) loadingCover.style.display = "none";

            // Setup the fullscreen button
            if (canFullscreen && fullscreenButton) {
              // The hideFullScreenButton template variable is not available, show button if fullscreen is possible
              // Reference: if (!hideFullScreenButton) { fullscreenButton.style.display = ""; }
              // Show the button if fullscreen is possible
                 fullscreenButton.style.display = "";

              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1); // Toggle fullscreen
              };
            }

        }).catch((message) => {
            // An error occurred during Unity loading or initialization
            console.error("Unity Loading Failed:", message);
            if (loadingCover) loadingCover.style.display = "none"; // Hide loading screen
            alert("Game failed to load: " + message); // Show error message
        });
      };

    </script>
  </body>
</html>
