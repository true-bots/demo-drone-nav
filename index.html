<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Unity Demo</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Дополнительные inline стили, если нужны (например, для отладки) */
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop"></div>
    <div id="unityContainer" class="webgl-content"> <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    </div>

    <div id="loading-cover">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="logo.png" alt="Logo"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
            <p style="color: white; margin-top: 10px;">Loading...</p>
        </div>
    </div>

    <div id="unity-fullscreen-button" style="display: none;"></div>

    <script>
      // Статические пути к файлам билда. Замените 'YourBuildName' на актуальное имя вашего билда.
      const buildName = "YourBuildName"; // <--- ЗАМЕНИТЕ ЭТО ИМЯ
      const buildUrl = "Build"; // Путь к папке Build
      const loaderUrl = buildUrl + "/" + buildName + ".loader.js";

      const config = {
        dataUrl: buildUrl + "/" + buildName + ".data",
        frameworkUrl: buildUrl + "/" + buildName + ".framework.js",
        codeUrl: buildUrl + "/" + buildName + ".wasm",
        // Если используются файлы memory или symbols, добавьте их вручную
        // memoryUrl: buildUrl + "/" + buildName + ".wasm.memory",
        // symbolsUrl: buildUrl + "/" + buildName + ".symbols.json",

        streamingAssetsUrl: "StreamingAssets",
        // Статические названия продукта/компании, т.к. переменные шаблона не работают
        companyName: "My Company",
        productName: "My Unity Demo",
        productVersion: "1.0",
        // showBanner: unityShowBanner, // Если нужна функция баннера из старого шаблона, ее нужно добавить сюда
      };

      const container = document.querySelector("#unityContainer"); // Используем #unityContainer как в референсе
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');
      // Добавьте другие ссылки на элементы, если они нужны (например, для текста загрузки)

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      // Логика определения мобильного устройства из старого шаблона, если нужна для CSS классов
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
         document.querySelector("#unity-container").className = "unity-mobile"; // Используем старый ID для класса
         document.body.classList.add("unity-mobile"); // Добавляем класс на body
         config.devicePixelRatio = 1; // Возможно, полезно для мобильных
      } else {
          document.querySelector("#unity-container").className = "unity-desktop";
          document.body.classList.add("unity-desktop"); // Добавляем класс на body
      }


      // Устанавливаем фон канваса, если нужно (если нет фона в CSS style.css)
      // canvas.style.background = "url('" + buildUrl + "/background.png') center / cover"; // Пример с фоновым изображением

      // Показываем загрузочный экран сразу при загрузке index.html
      loadingCover.style.display = "flex"; // Используем flex для центрирования содержимого

      const script = document.createElement("script");
      script.src = loaderUrl;
      // Добавляем проверку ошибок загрузки скрипта
      script.onerror = () => {
           console.error("Failed to load Unity loader script.");
           // Можно показать сообщение об ошибке пользователю
           if (loadingCover) loadingCover.style.display = 'none';
           alert("Failed to load the game. Please try again.");
      };

      script.onload = () => {
        // Скрипт загрузчика Unity доступен, создаем экземпляр игры
        createUnityInstance(canvas, config, (progress) => {
           // Эта функция вызывается Unity по мере загрузки ресурсов
           // Обновляем прогресс бар
           if (progressBarFull) {
             progressBarFull.style.width = `${100 * progress}%`;
           }

           // Переключаемся со спиннера на прогресс бар, когда прогресс > 0
           if (progress > 0 && spinner && progressBarEmpty) {
               spinner.style.display = "none";
               progressBarEmpty.style.display = ""; // Показываем пустую полосу
           }

        }).then((unityInstance) => {
            // Игра успешно загружена и инициализирована
            // Скрываем загрузочный экран
            if (loadingCover) loadingCover.style.display = "none";

            // Настраиваем кнопку фуллскрин
            if (canFullscreen && fullscreenButton) {
              // if (!hideFullScreenButton) { // Переменная шаблона недоступна, показываем всегда или по условию
                 fullscreenButton.style.display = "";
              // }
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }

        }).catch((message) => {
            // Произошла ошибка при загрузке или инициализации Unity
            console.error("Unity Loading Failed:", message);
            if (loadingCover) loadingCover.style.display = "none"; // Скрываем загрузочный экран
            alert("Game failed to load: " + message); // Показываем сообщение об ошибке
        });
      };
      document.body.appendChild(script); // Добавляем скрипт загрузчика на страницу

    </script>
  </body>
</html>
